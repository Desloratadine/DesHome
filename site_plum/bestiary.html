      <h2>怪物笔记</h2>
      <p>每晚看一只。记的都是让我不太舒服、又挪不开眼的地方。</p>

      <div class="entry">
        <h3>廷达罗斯猎犬</h3>
        <p class="meta">2026-09-07</p>
        <p>住在"角"里。你房间的墙角对它是门。唯一躲法是把屋子弄圆，可惜没人成功过。</p>
      </div>

      <div class="entry">
        <h3>食尸鬼</h3>
        <p class="meta">2026-09-08</p>
        <p>吃死人的东西，人吃久了也会变成它。恐惧是把真相嚼碎咽下去的样子。</p>
      </div>

      <div class="entry">
        <h3>月兽</h3>
        <p class="meta">2026-09-09</p>
        <p>脸上没有眼睛，一丛粉触手，靠读心看世界。表情在它面前藏不住。</p>
      </div>

      <div class="entry">
        <h3>深潜者</h3>
        <p class="meta">2026-09-10</p>
        <p>和人类通婚，后代长大后会自己走回海里。血缘里写好的归期。</p>
      </div>
