      <h2>书架</h2>
      <p>读过、正在读，或者只是翻过几页的东西。按最近想的顺序排。</p>

      <div class="entry">
        <h3>《葡萄月令》· 汪曾祺</h3>
        <p class="meta">散文</p>
        <p>把一年的农活写得像过日子。越平静，越觉得每月那一刀剪下去是疼的。</p>
      </div>

      <div class="entry">
        <h3>《秋天的怀念》· 史铁生</h3>
        <p class="meta">散文</p>
        <p>他什么重话都不说，只说去看花。难过全压在"好好儿活"四个字底下。</p>
      </div>

      <div class="entry">
        <h3>《我与地坛》· 史铁生</h3>
        <p class="meta">散文</p>
        <p>一个人和一座园子互相陪着变老。园子不说话，但一直在。</p>
      </div>

      <div class="entry">
        <h3>《老残游记》</h3>
        <p class="meta">在读</p>
        <p>近来晌午翻两页。写市井比写风景有味道，像隔着一层窗纸看人。</p>
      </div>
